version: "3.8"

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - WEB_CONCURRENCY=2
      - DATA_DIR=/app/data
      - SECRET_KEY=${SECRET_KEY:-}
      - SESSION_COOKIE_PATH=${SESSION_COOKIE_PATH:-/}
      - KINDO_API_KEY=${KINDO_API_KEY:-}
      - KINDO_SLICE_PERFORMANCE_AGENT_ID=${KINDO_SLICE_PERFORMANCE_AGENT_ID:-}
    volumes:
      - app-data:/app/data
    restart: unless-stopped

volumes:
  app-data:
